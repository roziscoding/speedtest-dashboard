<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedtest Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e4e7;
      --muted: #71717a;
      --download: #3b82f6;
      --upload: #8b5cf6;
      --ping: #f59e0b;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.5rem; font-weight: 600; }
    header .subtitle { color: var(--muted); font-size: 0.875rem; }
    .time-filters {
      display: flex;
      gap: 8px;
    }
    .time-filters button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .time-filters button:hover,
    .time-filters button.active {
      background: var(--border);
      color: var(--text);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .stat-card .label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .stat-card .unit {
      font-size: 0.875rem;
      color: var(--muted);
      font-weight: 400;
    }
    .stat-card .sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 6px;
    }
    .stat-card .sub span { margin-right: 12px; }
    .download .value { color: var(--download); }
    .upload .value { color: var(--upload); }
    .ping .value { color: var(--ping); }
    .health .value { color: var(--success); }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .chart-card h2 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .chart-wrap { position: relative; height: 300px; }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

    .recent-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .recent-table th {
      text-align: left;
      color: var(--muted);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
    }
    .recent-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 500;
    }
    .badge.completed { background: rgba(34,197,94,0.15); color: var(--success); }
    .badge.failed { background: rgba(239,68,68,0.15); color: var(--danger); }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--muted);
    }
    .isp-info {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .isp-info span { display: flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Speedtest Dashboard</h1>
        <div class="isp-info" id="isp-info"></div>
      </div>
      <div class="time-filters">
        <button data-range="24h" class="active">24h</button>
        <button data-range="7d">7d</button>
        <button data-range="30d">30d</button>
        <button data-range="all">All</button>
      </div>
    </header>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card download">
        <div class="label">Download</div>
        <div class="value" id="dl-avg">—</div>
        <div class="sub"><span id="dl-min"></span><span id="dl-max"></span></div>
      </div>
      <div class="stat-card upload">
        <div class="label">Upload</div>
        <div class="value" id="ul-avg">—</div>
        <div class="sub"><span id="ul-min"></span><span id="ul-max"></span></div>
      </div>
      <div class="stat-card ping">
        <div class="label">Ping</div>
        <div class="value" id="ping-avg">—</div>
        <div class="sub"><span id="ping-min"></span><span id="ping-max"></span></div>
      </div>
      <div class="stat-card health">
        <div class="label">Success Rate</div>
        <div class="value" id="success-rate">—</div>
        <div class="sub"><span id="total-tests"></span></div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h2>Download &amp; Upload Speed</h2>
        <div class="chart-wrap"><canvas id="speed-chart"></canvas></div>
      </div>
    </div>

    <div class="two-col">
      <div class="chart-card">
        <h2>Ping Latency</h2>
        <div class="chart-wrap"><canvas id="ping-chart"></canvas></div>
      </div>
      <div class="chart-card">
        <h2>Recent Tests</h2>
        <div style="max-height: 340px; overflow-y: auto;">
          <table class="recent-table">
            <thead><tr><th>Time</th><th>Down</th><th>Up</th><th>Ping</th><th>Status</th></tr></thead>
            <tbody id="recent-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const bitsHuman = (bandwidth) => {
      if (!bandwidth) return '—';
      const mbps = (bandwidth * 8) / 1e6;
      if (mbps >= 1000) return (mbps / 1000).toFixed(2) + ' <span class="unit">Gbps</span>';
      return mbps.toFixed(1) + ' <span class="unit">Mbps</span>';
    };
    const mbps = (bandwidth) => bandwidth ? ((bandwidth * 8) / 1e6).toFixed(1) : '—';

    let speedChart, pingChart;
    let currentRange = '24h';

    function formatDateParam(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const h = String(date.getHours()).padStart(2, '0');
      const min = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');
      return `${y}-${m}-${d} ${h}:${min}:${s}`;
    }

    function rangeToDate(range) {
      const now = new Date();
      if (range === '24h') return new Date(now - 24 * 60 * 60 * 1000);
      if (range === '7d') return new Date(now - 7 * 24 * 60 * 60 * 1000);
      if (range === '30d') return new Date(now - 30 * 24 * 60 * 60 * 1000);
      return null;
    }

    async function fetchJSON(url) {
      const res = await fetch(url);
      return res.json();
    }

    async function loadData(range) {
      currentRange = range;
      document.querySelectorAll('.time-filters button').forEach(b => b.classList.toggle('active', b.dataset.range === range));

      const start = rangeToDate(range);
      const startParam = start ? formatDateParam(start) : '';
      const resultsParams = new URLSearchParams({ per_page: '500' });
      if (startParam) resultsParams.set('start_at', startParam);
      const statsParams = startParam ? `start_at=${encodeURIComponent(startParam)}` : '';

      const [resultsRes, statsRes, latestRes] = await Promise.all([
        fetchJSON(`/api/results?${resultsParams}`),
        fetchJSON(`/api/stats?${statsParams}`),
        fetchJSON('/api/latest'),
      ]);

      const results = resultsRes.data || [];
      const stats = statsRes.data || {};
      const latest = latestRes.data || {};

      // ISP info from latest
      const data = latest.data || {};
      const isp = data.isp || '';
      const server = data.server || data.serverSelection?.servers?.[0]?.server || {};
      const extIp = data.interface?.externalIp || '';
      $('#isp-info').innerHTML = [
        isp && `<span>${isp}</span>`,
        server.name && `<span>${server.name} — ${server.location}, ${server.country}</span>`,
        extIp && `<span>${extIp}</span>`,
      ].filter(Boolean).join('');

      // Stats cards
      if (stats.download) {
        $('#dl-avg').innerHTML = bitsHuman(stats.download.avg);
        $('#dl-min').textContent = `Min: ${mbps(stats.download.min)} Mbps`;
        $('#dl-max').textContent = `Max: ${mbps(stats.download.max)} Mbps`;
      }
      if (stats.upload) {
        $('#ul-avg').innerHTML = bitsHuman(stats.upload.avg);
        $('#ul-min').textContent = `Min: ${mbps(stats.upload.min)} Mbps`;
        $('#ul-max').textContent = `Max: ${mbps(stats.upload.max)} Mbps`;
      }
      if (stats.ping) {
        $('#ping-avg').innerHTML = stats.ping.avg.toFixed(1) + ' <span class="unit">ms</span>';
        $('#ping-min').textContent = `Min: ${stats.ping.min.toFixed(1)} ms`;
        $('#ping-max').textContent = `Max: ${stats.ping.max.toFixed(1)} ms`;
      }

      const completed = results.filter(r => r.status === 'completed').length;
      const total = results.length;
      const rate = total > 0 ? ((completed / total) * 100).toFixed(0) : '—';
      $('#success-rate').innerHTML = rate + '<span class="unit">%</span>';
      $('#total-tests').textContent = `${completed} / ${total} tests`;

      // Charts
      const sorted = [...results].filter(r => r.status === 'completed').sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      const labels = sorted.map(r => new Date(r.created_at));
      const dlData = sorted.map(r => (r.download * 8) / 1e6);
      const ulData = sorted.map(r => (r.upload * 8) / 1e6);
      const pingData = sorted.map(r => r.ping);

      const commonOpts = {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#71717a', usePointStyle: true, pointStyle: 'circle', padding: 16 } },
          tooltip: {
            backgroundColor: '#1a1d27',
            borderColor: '#2a2d3a',
            borderWidth: 1,
            titleColor: '#e4e4e7',
            bodyColor: '#e4e4e7',
          },
        },
        scales: {
          x: {
            type: 'time',
            grid: { color: 'rgba(255,255,255,0.04)' },
            ticks: { color: '#71717a', maxTicksLimit: 12 },
          },
          y: {
            grid: { color: 'rgba(255,255,255,0.04)' },
            ticks: { color: '#71717a' },
            beginAtZero: true,
          },
        },
      };

      if (speedChart) speedChart.destroy();
      speedChart = new Chart($('#speed-chart'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Download (Mbps)',
              data: dlData,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59,130,246,0.1)',
              fill: true,
              tension: 0.3,
              pointRadius: range === '24h' ? 3 : 0,
              borderWidth: 2,
            },
            {
              label: 'Upload (Mbps)',
              data: ulData,
              borderColor: '#8b5cf6',
              backgroundColor: 'rgba(139,92,246,0.1)',
              fill: true,
              tension: 0.3,
              pointRadius: range === '24h' ? 3 : 0,
              borderWidth: 2,
            },
          ],
        },
        options: { ...commonOpts, scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, ticks: { ...commonOpts.scales.y.ticks, callback: v => v + ' Mbps' } } } },
      });

      if (pingChart) pingChart.destroy();
      pingChart = new Chart($('#ping-chart'), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Ping (ms)',
            data: pingData,
            borderColor: '#f59e0b',
            backgroundColor: 'rgba(245,158,11,0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: range === '24h' ? 3 : 0,
            borderWidth: 2,
          }],
        },
        options: { ...commonOpts, scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, ticks: { ...commonOpts.scales.y.ticks, callback: v => v + ' ms' } } } },
      });

      // Recent tests table
      const recent = results.slice(0, 15);
      $('#recent-body').innerHTML = recent.map(r => {
        const time = new Date(r.created_at).toLocaleString('en-GB', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        return `<tr>
          <td>${time}</td>
          <td>${r.download ? mbps(r.download) : '—'}</td>
          <td>${r.upload ? mbps(r.upload) : '—'}</td>
          <td>${r.ping?.toFixed(1) ?? '—'}</td>
          <td><span class="badge ${r.status}">${r.status}</span></td>
        </tr>`;
      }).join('');
    }

    // Init
    document.querySelectorAll('.time-filters button').forEach(btn => {
      btn.addEventListener('click', () => loadData(btn.dataset.range));
    });
    loadData('24h');

    // Auto-refresh every 60s
    setInterval(() => loadData(currentRange), 60000);
  </script>
</body>
</html>
